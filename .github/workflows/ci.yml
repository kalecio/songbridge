name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libasound2-dev
            libasound2-plugins
            pulseaudio
            pulseaudio-utils
            alsa-utils
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Setup audio device
        run: |
          # Use ALSA null device - always available, no kernel modules needed
          echo 'pcm.!default { type null }' | sudo tee /etc/asound.conf
          echo 'ctl.!default { type null }' | sudo tee -a /etc/asound.conf
          
          # Verify
          cat /etc/asound.conf
          aplay -L 2>&1 | head -10
          
      - name: Run tests with null audio
        run: |
          # Verify audio setup
          echo "=== ALSA devices ==="
          aplay -L 2>&1 | head -20
          cat /etc/asound.conf
          
          # Run tests
          cd src-tauri
          cargo test --lib -- --nocapture 2>&1

      - name: Security audit
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
        working-directory: src-tauri
