name: Deploy Last.fm Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/lastfm/**"
      - ".github/workflows/deploy-lastfm-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Deploy Worker
        working-directory: worker/lastfm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Set Last.fm credentials
        working-directory: worker/lastfm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(`${process.env.RUNNER_TEMP}/lastfm-secrets.json`, JSON.stringify({ LASTFM_API_KEY: process.env.LASTFM_API_KEY, LASTFM_API_SECRET: process.env.LASTFM_API_SECRET }));'
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/lastfm-secrets.json"
