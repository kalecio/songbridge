name: 'Release'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            # Only available in public repositories.
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release metadata
        id: release-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/prepare-release-metadata.mjs

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows MSI version
        if: matrix.platform == 'windows-latest'
        run: node scripts/prepare-windows-msi-config.mjs

      # The Tauri updater key signs update artifacts, not the macOS app itself.
      # Only export Apple signing variables when the certificate is configured
      # so open-source builds without an Apple Developer certificate stay valid.
      - name: Configure Apple code signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            if [[ -n "$APPLE_CERTIFICATE_PASSWORD" || -n "$APPLE_SIGNING_IDENTITY" ]]; then
              echo "::error::Set APPLE_CERTIFICATE together with its password before enabling Apple signing."
              exit 1
            fi
            echo "::notice::Apple code signing is not configured; the macOS app will not have a stable Apple signing identity."
            exit 0
          fi

          if [[ -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set."
            exit 1
          fi

          {
            printf 'APPLE_CERTIFICATE=%s\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
              printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY"
            fi
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_WORKER_URL: ${{ vars.LASTFM_WORKER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release-metadata.outputs.tag }}
          releaseName: ${{ steps.release-metadata.outputs.releaseName }}
          releaseBody: ${{ steps.release-metadata.outputs.body }}
          releaseDraft: true
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}
          # Preserve the app's SemVer for builds; RPM gets its own normalized
          # package version in the separate step below.
          args: ${{ startsWith(matrix.platform, 'ubuntu') && steps.release-metadata.outputs.prerelease == 'true' && '--bundles deb,appimage' || matrix.args }}

      - name: Prepare RPM prerelease version
        if: startsWith(matrix.platform, 'ubuntu') && steps.release-metadata.outputs.prerelease == 'true'
        run: node scripts/prepare-rpm-prerelease-config.mjs

      - name: Build and upload RPM bundle
        if: startsWith(matrix.platform, 'ubuntu') && steps.release-metadata.outputs.prerelease == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_WORKER_URL: ${{ vars.LASTFM_WORKER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: ${{ github.workspace }}/scripts/tauri-rpm-bundle.sh
          tagName: ${{ steps.release-metadata.outputs.tag }}
          releaseName: ${{ steps.release-metadata.outputs.releaseName }}
          releaseBody: ${{ steps.release-metadata.outputs.body }}
          releaseDraft: true
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}
          args: --bundles rpm --config src-tauri/tauri.rpm-prerelease.conf.json
